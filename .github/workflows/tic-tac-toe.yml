name: Play Tic-Tac-Toe

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt|')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process Move & Run AI Turn
        id: ttt
        run: |
          python scripts/play_ttt.py "${{ github.event.issue.title }}" "${{ github.event.issue.user.login }}"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/ttt_state.json
          git commit -m "game(ttt): move played by @${{ github.event.issue.user.login }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Close Issue with Response
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const user = context.payload.issue.user.login;
            const title = context.payload.issue.title;
            
            let message = `⚔️ Cảm ơn **@${user}** đã tham gia thách đấu AI Bot!\\n\\n` +
                          `Nước cờ của bạn đã được ghi nhận và AI Bot đã tính toán phản hồi thành công.\\n` +
                          `👉 Hãy quay lại trang cá nhân [**quangnhat1504**](https://github.com/quangnhat1504) để xem bàn cờ mới nhất! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
